[project]
name = "container-autopsy"
version = "1.0.0"
description = "Forensics for dead Docker containers: exit codes, OOM and log evidence turned into a markdown autopsy report. Zero dependencies, optional local AI."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Fernedy Arias" }]
keywords = ["docker", "containers", "forensics", "ai", "observability", "sre"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
container-autopsy = "container_autopsy:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["container_autopsy"]
